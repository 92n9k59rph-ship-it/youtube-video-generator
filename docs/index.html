<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Tendalia · Muy pronto</title>
<!-- La web completa de la lista de espera está guardada en web/anunciafacil/index.html.
     Para volver a publicarla, se copia ese archivo aquí. -->
<style>
  :root { --paper: #f6f7fb; --ink: #1b2233; --muted: #5a6275; --sun: #ffc53d; }
  @media (prefers-color-scheme: dark) { :root { --paper: #12151d; --ink: #eef0f6; --muted: #a3aabb; --sun: #ffcf5c; } }
  html, body { margin: 0; height: 100%; }
  body { background: var(--paper); color: var(--ink); font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
         display: grid; place-items: center; text-align: center; padding: 0 16px; }
  .tag { display: inline-block; font: 700 .8rem/1 system-ui; letter-spacing: .08em; text-transform: uppercase;
         background: var(--sun); color: #1b2233; padding: 8px 12px; border-radius: 6px; transform: rotate(-1.5deg); }
  h1 { font-size: clamp(1.8rem, 6vw, 2.6rem); margin: 18px 0 8px; }
  p { color: var(--muted); margin: 0; }
</style>
</head>
<body>
  <main>
    <span class="tag">Muy pronto</span>
    <h1>Estamos preparando algo para tu negocio</h1>
    <p>Vuelve dentro de poco.</p>
  </main>
</body>
</html>
